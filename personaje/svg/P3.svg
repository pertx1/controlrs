<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- P3 · CALLE · póster serigrafía · Pertx -->
  <defs>
    <pattern id="q3dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.6" fill="#0E0E0E"/></pattern>
    <pattern id="q3dotsR" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#7A0300"/></pattern>
    <filter id="q3grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>
  <rect width="300" height="400" fill="#E9E2D3"/>
  <!-- círculo rojo -->
  <circle cx="150" cy="176" r="118" fill="#E10600"/>
  <circle cx="150" cy="176" r="118" fill="url(#q3dotsR)" opacity=".35"/>
  <!-- texto vertical -->
  <text x="276" y="40" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" fill="#0E0E0E" transform="rotate(90 276 40)" letter-spacing="6">PERTX</text>

  <!-- cuerpo: sudadera negra -->
  <path d="M14 400 Q22 290 92 262 L208 262 Q278 290 286 400 Z" fill="#0E0E0E"/>
  <path d="M60 330 Q70 300 96 286 L96 400 L56 400 Z" fill="url(#q3dots)" opacity=".5"/>
  <!-- capucha sobre gorra -->
  <path d="M84 278 Q68 140 150 96 Q232 140 216 278 Q196 256 150 256 Q104 256 84 278 Z" fill="#0E0E0E"/>
  <path d="M96 150 Q150 116 204 150" stroke="#E9E2D3" stroke-width="2.5" fill="none"/>
  <!-- gorra -->
  <path d="M102 158 Q104 118 150 114 Q196 118 198 158 Z" fill="#1C1C1C"/>
  <path d="M96 160 Q150 146 204 160 Q206 172 196 174 Q150 162 104 174 Q94 172 96 160 Z" fill="#0E0E0E" stroke="#E9E2D3" stroke-width="2"/>
  <!-- sombra de la cara -->
  <path d="M108 172 Q150 160 192 172 L190 216 Q150 226 110 216 Z" fill="#050505"/>
  <!-- ojos: solo brillo -->
  <path d="M126 196 Q134 191 142 196 Q134 199 126 196 Z" fill="#E9E2D3"/>
  <path d="M158 196 Q166 191 174 196 Q166 199 158 196 Z" fill="#E9E2D3"/>
  <circle cx="134" cy="196" r="2.2" fill="#0E0E0E"/>
  <circle cx="166" cy="196" r="2.2" fill="#0E0E0E"/>
  <!-- bandana / braga de cuello -->
  <path d="M106 210 Q150 222 194 210 L196 250 Q176 274 150 276 Q124 274 104 250 Z" fill="#1A1A1A"/>
  <path d="M106 210 Q150 222 194 210 L196 250 Q176 274 150 276 Q124 274 104 250 Z" fill="url(#q3dots)" opacity=".35"/>
  <path d="M112 230 Q150 242 188 230 M114 248 Q150 262 186 248" stroke="#E10600" stroke-width="3" fill="none"/>
  <path d="M106 210 Q150 222 194 210" stroke="#E9E2D3" stroke-width="2" fill="none"/>
  <!-- cordones -->
  <path d="M130 268 L126 330 M170 268 L174 330" stroke="#E9E2D3" stroke-width="3" stroke-linecap="round"/>
  <!-- pegatina PX -->
  <g transform="rotate(-8 214 330)">
    <rect x="190" y="316" width="50" height="26" fill="#E10600"/>
    <text x="215" y="336" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="18" fill="#0E0E0E" text-anchor="middle">PX</text>
  </g>
  <rect width="300" height="400" fill="#E9E2D3" filter="url(#q3grain)" opacity=".9" style="mix-blend-mode:multiply"/>

  <!-- código -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="12" y="12" width="76" height="44" rx="11" fill="#0E0E0E"/>
    <text x="50" y="40" font-size="24" font-weight="800" fill="#E9E2D3">P3</text>
    <text x="50" y="51" font-size="8" font-weight="700" fill="#FF3B30" letter-spacing=".6">CALLE</text>
  </g>
</svg>
