<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- P3 · Semi-realista cinematográfico · Pertx -->
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1E27"/><stop offset="1" stop-color="#0C0E13"/></linearGradient>
    <radialGradient id="p3lamp" cx="12%" cy="58%" r="55%"><stop offset="0" stop-color="#FFB347" stop-opacity=".55"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></radialGradient>
    <radialGradient id="p3mon" cx="88%" cy="45%" r="55%"><stop offset="0" stop-color="#3D7BFF" stop-opacity=".45"/><stop offset="1" stop-color="#3D7BFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="p3skin" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#EBBC94"/><stop offset=".65" stop-color="#D9A57E"/><stop offset="1" stop-color="#A9744F"/></radialGradient>
    <linearGradient id="p3light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347" stop-opacity=".28"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#3D7BFF" stop-opacity=".30"/></linearGradient>
    <linearGradient id="p3hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2A1F"/><stop offset="1" stop-color="#1E150F"/></linearGradient>
    <linearGradient id="p3fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1F17" stop-opacity=".85"/><stop offset="1" stop-color="#2B1F17" stop-opacity="0"/></linearGradient>
    <linearGradient id="p3sweat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A433C"/><stop offset=".45" stop-color="#3A3A3C"/><stop offset="1" stop-color="#2A3346"/></linearGradient>
    <linearGradient id="p3desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A6242"/><stop offset="1" stop-color="#4E3522"/></linearGradient>
    <pattern id="p3knit" width="6" height="8" patternUnits="userSpaceOnUse"><path d="M3 0 L0 4 L3 8 M3 0 L6 4 L3 8" stroke="#000" stroke-opacity=".18" fill="none" stroke-width="1"/></pattern>
    <pattern id="p3stub" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#2B1F17"/><circle cx="3" cy="3" r=".5" fill="#2B1F17"/></pattern>
    <filter id="p3blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="p3blur8"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="p3face"><path d="M108 140 Q106 90 150 84 Q194 90 192 140 Q190 178 168 196 Q150 206 132 196 Q110 178 108 140 Z"/></clipPath>
  </defs>
  <rect width="300" height="400" fill="url(#p3bg)"/>
  <!-- ventana con luces de ciudad (genérica) -->
  <rect x="14" y="20" width="96" height="130" rx="3" fill="#121A2C"/>
  <g filter="url(#p3blur)" opacity=".9">
    <circle cx="30" cy="110" r="3" fill="#FFC870"/><circle cx="46" cy="96" r="2.5" fill="#FFE2A8"/><circle cx="64" cy="118" r="3" fill="#FFB347"/>
    <circle cx="82" cy="102" r="2.5" fill="#9CC0FF"/><circle cx="96" cy="124" r="3" fill="#FFC870"/><circle cx="38" cy="132" r="2.5" fill="#FFE2A8"/>
    <circle cx="74" cy="136" r="3" fill="#FFB347"/><circle cx="56" cy="80" r="2" fill="#9CC0FF"/><circle cx="90" cy="84" r="2" fill="#FFE2A8"/>
  </g>
  <path d="M62 20 L62 150 M14 84 L110 84" stroke="#1B1E27" stroke-width="4"/>
  <!-- monitor -->
  <rect x="196" y="58" width="112" height="150" rx="6" fill="#0A1124" stroke="#2A3346" stroke-width="3"/>
  <g stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M208 76 L236 76" stroke="#3D7BFF"/><path d="M216 88 L262 88" stroke="#7FA8FF"/><path d="M216 100 L248 100" stroke="#C792EA"/>
    <path d="M208 112 L270 112" stroke="#3D7BFF"/><path d="M216 124 L240 124" stroke="#89DDFF"/><path d="M216 136 L258 136" stroke="#7FA8FF"/>
    <path d="M208 148 L230 148" stroke="#C792EA"/><path d="M216 160 L266 160" stroke="#3D7BFF"/>
  </g>
