  <path d="M22 230 L54 196 L64 206" stroke="#2A2A2A" stroke-width="4" fill="none"/>
  <path d="M50 186 L80 200 L70 218 L44 204 Z" fill="#2A2A2A"/>
  <ellipse cx="60" cy="214" rx="14" ry="5" fill="#FFD08A" filter="url(#p3blur)"/>

  <!-- torso jersey -->
  <path d="M40 400 L46 296 Q52 246 110 232 L190 232 Q248 246 254 296 L260 400 Z" fill="url(#p3sweat)"/>
  <path d="M40 400 L46 296 Q52 246 110 232 L190 232 Q248 246 254 296 L260 400 Z" fill="url(#p3knit)"/>
  <path d="M110 234 Q118 256 150 260 Q182 256 190 234" stroke="#2C2C2E" stroke-width="10" fill="none"/>
  <path d="M118 232 Q126 248 150 250 Q174 248 182 232 Z" fill="#F2F2F2"/>
  <!-- cuello -->
  <path d="M128 186 L128 236 Q150 248 172 236 L172 186 Z" fill="url(#p3skin)"/>
  <path d="M128 200 Q150 222 172 200 L172 214 Q150 232 128 214 Z" fill="#7A4E33" opacity=".35" filter="url(#p3blur)"/>
  <g transform="translate(-7.5 16) scale(1.05)">
  <!-- orejas -->
  <ellipse cx="108" cy="146" rx="9" ry="16" fill="#C98F66"/>
  <ellipse cx="192" cy="146" rx="9" ry="16" fill="#B98563"/>
  <!-- cara -->
  <path d="M108 140 Q106 90 150 84 Q194 90 192 140 Q190 178 168 196 Q150 206 132 196 Q110 178 108 140 Z" fill="url(#p3skin)"/>
  <g clip-path="url(#p3face)">
    <rect x="100" y="80" width="100" height="130" fill="url(#p3light)"/>
    <!-- sombras de volumen -->
    <path d="M176 110 Q192 140 182 176 L200 176 L200 100 Z" fill="#6E4A33" opacity=".35" filter="url(#p3blur8)"/>
    <ellipse cx="150" cy="200" rx="34" ry="10" fill="#6E4A33" opacity=".35" filter="url(#p3blur)"/>
    <!-- barba de pocos días -->
    <path d="M112 156 Q118 184 134 196 Q150 206 166 196 Q182 184 188 156 Q184 176 170 182 Q160 170 150 172 Q140 170 130 182 Q116 176 112 156 Z" fill="url(#p3stub)" opacity=".55"/>
    <path d="M136 168 Q150 162 164 168 Q160 172 150 170 Q140 172 136 168 Z" fill="url(#p3stub)" opacity=".7"/>
  </g>
  <!-- pelo corto con degradado -->
  <path d="M106 142 Q104 108 112 98 L112 132 Z" fill="url(#p3fade)"/>
  <path d="M194 142 Q196 108 188 98 L188 132 Z" fill="url(#p3fade)"/>
  <path d="M108 120 Q100 74 150 68 Q202 72 192 120 Q188 102 176 96 Q150 88 124 96 Q112 102 108 120 Z" fill="url(#p3hair)"/>
  <g stroke="#4A382B" stroke-width="1.4" stroke-linecap="round" opacity=".8">
    <path d="M122 84 L128 76"/><path d="M134 80 L142 72"/><path d="M148 78 L156 70"/><path d="M162 80 L170 73"/><path d="M174 86 L182 80"/><path d="M128 92 L136 84"/><path d="M156 88 L164 80"/>
  </g>
  <!-- cejas -->
  <path d="M120 122 Q132 114 144 120 L143 124 Q132 119 121 125 Z" fill="#2B1F17"/>
  <path d="M180 122 Q168 114 156 120 L157 124 Q168 119 179 125 Z" fill="#2B1F17"/>
  <!-- ojos -->
  <path d="M122 136 Q132 128 143 136 Q132 141 122 136 Z" fill="#F4EDE6"/>
  <path d="M157 136 Q168 128 178 136 Q168 141 157 136 Z" fill="#F4EDE6"/>
  <circle cx="133" cy="135" r="4.6" fill="#5C3B22"/><circle cx="167" cy="135" r="4.6" fill="#5C3B22"/>
  <circle cx="133" cy="135" r="2.1" fill="#120C08"/><circle cx="167" cy="135" r="2.1" fill="#120C08"/>
  <circle cx="134.6" cy="133.6" r="1.1" fill="#FFF"/><circle cx="168.6" cy="133.6" r="1.1" fill="#FFF"/>
  <path d="M121 136 Q132 127 144 135" stroke="#2B1F17" stroke-width="1.8" fill="none"/>
  <path d="M156 135 Q168 127 179 136" stroke="#2B1F17" stroke-width="1.8" fill="none"/>
  <path d="M124 141 Q132 144 141 140" stroke="#A9744F" stroke-width="1" fill="none" opacity=".6"/>
  <path d="M159 140 Q168 144 176 141" stroke="#A9744F" stroke-width="1" fill="none" opacity=".6"/>
  <!-- nariz -->
  <path d="M152 136 Q156 152 158 160 Q154 164 150 163" stroke="#A9744F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M141 161 Q144 158 147 161 M153 161 Q156 158 159 161" stroke="#8A5A3C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- boca -->
  <path d="M137 177 Q150 172 165 176 Q151 180 137 177 Z" fill="#9C5E4A"/>
  <path d="M138 177 Q151 187 164 177 Q151 182 138 177 Z" fill="#B87563"/>
  <path d="M164 176 Q167 174 168 172" stroke="#8A5A3C" stroke-width="1.2" fill="none"/>

  </g>
  <!-- escritorio y antebrazos -->
  <rect x="0" y="352" width="300" height="48" fill="url(#p3desk)"/>
  <path d="M0 352 L300 352" stroke="#B08560" stroke-width="2"/>
  <path d="M70 340 Q72 326 110 326 L186 330 Q200 334 196 348 L80 356 Q68 352 70 340 Z" fill="#35353A"/>
  <path d="M230 342 Q228 328 190 328 L122 334 Q106 338 110 350 L222 356 Q232 352 230 342 Z" fill="#3A3A3C"/>
  <ellipse cx="196" cy="340" rx="11" ry="9" fill="url(#p3skin)"/>
  <ellipse cx="112" cy="344" rx="11" ry="8" fill="#C98F66"/>
  <rect x="210" y="334" width="14" height="10" rx="3" fill="#111"/>
  <!-- taza -->
  <rect x="248" y="318" width="30" height="38" rx="5" fill="#1F1F22"/>
  <path d="M278 326 Q290 330 278 344" stroke="#1F1F22" stroke-width="5" fill="none"/>

  <!-- código -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="12" y="12" width="76" height="44" rx="11" fill="#FFFFFF" opacity=".94"/>
    <text x="50" y="40" font-size="24" font-weight="800" fill="#111111">P3</text>
    <text x="50" y="51" font-size="8" font-weight="700" fill="#B26A00" letter-spacing=".5">SEMI-REALISTA</text>
  </g>
</svg>
