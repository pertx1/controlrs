<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- P2 · GLITCH · cyberpunk neón · Pertx -->
  <defs>
    <linearGradient id="q2bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D0221"/><stop offset="1" stop-color="#1D0B45"/></linearGradient>
    <radialGradient id="q2eye" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#00F0FF"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="q2jack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#191526"/><stop offset=".6" stop-color="#231D36"/><stop offset="1" stop-color="#2E2048"/></linearGradient>
    <radialGradient id="q2mask" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#3A3742"/><stop offset="1" stop-color="#15131C"/></radialGradient>
    <pattern id="q2knit" width="4" height="6" patternUnits="userSpaceOnUse"><path d="M2 0 L0 3 L2 6 M2 0 L4 3 L2 6" stroke="#000" stroke-opacity=".4" fill="none" stroke-width=".7"/></pattern>
    <filter id="q2glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="400" fill="url(#q2bg)"/>
  <!-- ciudad neón -->
  <g fill="#120634">
    <rect x="0" y="210" width="40" height="190"/><rect x="36" y="170" width="34" height="230"/><rect x="232" y="150" width="36" height="250"/><rect x="264" y="200" width="36" height="200"/>
  </g>
  <g fill="#FF2BD6" opacity=".7"><rect x="44" y="184" width="4" height="3"/><rect x="56" y="200" width="4" height="3"/><rect x="242" y="168" width="4" height="3"/><rect x="254" y="190" width="4" height="3"/><rect x="274" y="214" width="4" height="3"/></g>
  <g fill="#00F0FF" opacity=".7"><rect x="10" y="226" width="4" height="3"/><rect x="50" y="232" width="4" height="3"/><rect x="246" y="230" width="4" height="3"/><rect x="284" y="250" width="4" height="3"/></g>
  <g stroke="#FF2BD6" stroke-width="1" opacity=".35"><path d="M0 352 L300 352 M0 368 L300 368 M0 386 L300 386"/><path d="M150 340 L40 400 M150 340 L260 400 M150 340 L150 400"/></g>

  <!-- chaqueta techwear -->
  <path d="M30 400 Q36 300 102 272 L198 272 Q264 300 270 400 Z" fill="url(#q2jack)"/>
  <path d="M150 276 L150 400" stroke="#0B0815" stroke-width="3"/>
  <path d="M146 276 L146 400 M154 276 L154 400" stroke="#FF2BD6" stroke-width="1.2" filter="url(#q2glow)"/>
  <path d="M70 330 L110 312 M230 330 L190 312" stroke="#00F0FF" stroke-width="1.6" filter="url(#q2glow)"/>
  <rect x="176" y="318" width="34" height="14" rx="3" fill="#0B0815" stroke="#00F0FF" stroke-width="1"/>
  <text x="193" y="329" font-family="Consolas, monospace" font-weight="700" font-size="10" fill="#00F0FF" text-anchor="middle" filter="url(#q2glow)">PX</text>
  <!-- cuello alto con LED -->
  <path d="M104 262 L116 296 L150 284 L184 296 L196 262 Q150 276 104 262 Z" fill="#14111F"/>
  <path d="M110 270 Q150 286 190 270" stroke="#FF2BD6" stroke-width="2.4" fill="none" filter="url(#q2glow)"/>

  <!-- cabeza con pasamontañas de dos agujeros -->
  <path d="M106 186 Q104 120 150 116 Q196 120 194 186 Q194 240 170 258 Q150 268 130 258 Q106 240 106 186 Z" fill="url(#q2mask)"/>
  <path d="M106 186 Q104 120 150 116 Q196 120 194 186 Q194 240 170 258 Q150 268 130 258 Q106 240 106 186 Z" fill="url(#q2knit)"/>
  <path d="M106 186 Q104 120 150 116" stroke="#FF2BD6" stroke-width="1.6" fill="none" opacity=".7"/>
  <path d="M194 186 Q196 120 150 116" stroke="#00F0FF" stroke-width="1.6" fill="none" opacity=".7"/>
  <!-- agujeros de ojos con LEDs -->
  <ellipse cx="130" cy="180" rx="15" ry="11" fill="#07050D"/>
  <ellipse cx="170" cy="180" rx="15" ry="11" fill="#07050D"/>
  <ellipse cx="130" cy="180" rx="14" ry="10" fill="url(#q2eye)"/>
  <ellipse cx="170" cy="180" rx="14" ry="10" fill="url(#q2eye)"/>
  <rect x="122" y="178" width="16" height="3.5" rx="1.75" fill="#FFFFFF" filter="url(#q2glow)"/>
  <rect x="162" y="178" width="16" height="3.5" rx="1.75" fill="#FFFFFF" filter="url(#q2glow)"/>
  <!-- agujero de boca -->
  <rect x="136" y="220" width="28" height="9" rx="4.5" fill="#07050D"/>
  <path d="M140 224.5 L160 224.5" stroke="#FF2BD6" stroke-width="1.2" opacity=".8"/>

  <!-- efecto glitch -->
  <g opacity=".85">
    <rect x="96" y="150" width="34" height="4" fill="#00F0FF"/>
    <rect x="186" y="196" width="22" height="3" fill="#FF2BD6"/>
    <rect x="100" y="232" width="18" height="3" fill="#FF2BD6"/>
    <rect x="176" y="140" width="30" height="2.5" fill="#FFFFFF" opacity=".6"/>
    <rect x="112" y="204" width="76" height="3" fill="#1D0B45"/>
    <rect x="118" y="206" width="76" height="2" fill="#3A3742"/>
  </g>

  <!-- código -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="12" y="12" width="76" height="44" rx="11" fill="#F2F2F2"/>
    <text x="50" y="40" font-size="24" font-weight="800" fill="#0D0221">P2</text>
    <text x="50" y="51" font-size="8" font-weight="700" fill="#C2009F" letter-spacing=".6">GLITCH</text>
  </g>
</svg>
