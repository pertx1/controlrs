<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- P5 · ÉLITE · lujo oscuro con oro · Pertx -->
  <defs>
    <radialGradient id="q5bg" cx="50%" cy="28%" r="75%"><stop offset="0" stop-color="#2A2219"/><stop offset=".55" stop-color="#13100C"/><stop offset="1" stop-color="#080706"/></radialGradient>
    <linearGradient id="q5gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5DE9A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#8E6E1E"/></linearGradient>
    <radialGradient id="q5mask" cx="40%" cy="32%" r="72%"><stop offset="0" stop-color="#2C2C2E"/><stop offset="1" stop-color="#0B0B0C"/></radialGradient>
    <linearGradient id="q5coat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E0E10"/><stop offset=".5" stop-color="#1F1E22"/><stop offset="1" stop-color="#0E0E10"/></linearGradient>
    <linearGradient id="q5turtle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#111"/><stop offset=".5" stop-color="#252427"/><stop offset="1" stop-color="#111"/></linearGradient>
    <pattern id="q5rib" width="4" height="10" patternUnits="userSpaceOnUse"><path d="M2 0 V10" stroke="#000" stroke-opacity=".45" stroke-width="1.2"/></pattern>
    <pattern id="q5knit" width="5" height="4" patternUnits="userSpaceOnUse"><path d="M0 2 Q1.25 0 2.5 2 T5 2" stroke="#000" stroke-opacity=".5" fill="none" stroke-width=".8"/></pattern>
    <filter id="q5b"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="300" height="400" fill="url(#q5bg)"/>
  <ellipse cx="150" cy="120" rx="120" ry="70" fill="#D4AF37" opacity=".08" filter="url(#q5b)"/>
  <path d="M30 60 H270" stroke="url(#q5gold)" stroke-width=".8" opacity=".5"/>

  <!-- abrigo -->
  <path d="M16 400 Q22 294 94 266 L206 266 Q278 294 284 400 Z" fill="url(#q5coat)"/>
  <!-- solapas -->
  <path d="M104 266 L150 340 L124 400 L84 400 L92 300 Z" fill="#17161A" stroke="#2C2A30" stroke-width="1.5"/>
  <path d="M196 266 L150 340 L176 400 L216 400 L208 300 Z" fill="#17161A" stroke="#2C2A30" stroke-width="1.5"/>
  <!-- jersey de cuello alto -->
  <path d="M118 262 L182 262 L176 330 L150 344 L124 330 Z" fill="url(#q5turtle)"/>
  <path d="M118 262 L182 262 L176 330 L150 344 L124 330 Z" fill="url(#q5rib)" opacity=".35"/>
  <rect x="120" y="236" width="60" height="34" rx="10" fill="url(#q5turtle)"/>
  <rect x="120" y="236" width="60" height="34" rx="10" fill="url(#q5rib)"/>
  <!-- broche dorado en la solapa -->
  <circle cx="196" cy="318" r="6" fill="url(#q5gold)"/>

  <!-- cabeza con pasamontañas -->
  <path d="M108 168 Q106 104 150 100 Q194 104 192 168 Q192 222 170 238 Q150 248 130 238 Q108 222 108 168 Z" fill="url(#q5mask)"/>
  <path d="M108 168 Q106 104 150 100 Q194 104 192 168 Q192 222 170 238 Q150 248 130 238 Q108 222 108 168 Z" fill="url(#q5knit)"/>
  <!-- bordado PX -->
  <text x="150" y="132" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15" fill="url(#q5gold)" text-anchor="middle" letter-spacing="1.5">PX</text>
  <!-- agujeros de ojos -->
  <ellipse cx="131" cy="164" rx="14" ry="10" fill="#C08E6A"/>
  <ellipse cx="169" cy="164" rx="14" ry="10" fill="#C08E6A"/>
  <ellipse cx="131" cy="160" rx="14" ry="5" fill="#5A3C2A" opacity=".55"/>
  <ellipse cx="169" cy="160" rx="14" ry="5" fill="#5A3C2A" opacity=".55"/>
  <ellipse cx="131" cy="166" rx="7" ry="4.2" fill="#ECE4DA"/>
  <ellipse cx="169" cy="166" rx="7" ry="4.2" fill="#ECE4DA"/>
  <circle cx="132" cy="166" r="3.3" fill="#2A1C12"/>
  <circle cx="170" cy="166" r="3.3" fill="#2A1C12"/>
  <circle cx="133.2" cy="164.8" r="1" fill="#F5DE9A"/>
  <circle cx="171.2" cy="164.8" r="1" fill="#F5DE9A"/>
  <path d="M124 162 Q131 159 138 162 M162 162 Q169 159 176 162" stroke="#1E140E" stroke-width="1.6" fill="none"/>
  <ellipse cx="131" cy="164" rx="14" ry="10" fill="none" stroke="#050505" stroke-width="2.5"/>
  <ellipse cx="169" cy="164" rx="14" ry="10" fill="none" stroke="#050505" stroke-width="2.5"/>
  <!-- luz dorada de borde -->
  <path d="M108 168 Q106 104 150 100" stroke="url(#q5gold)" stroke-width="1.6" fill="none" opacity=".5"/>
  <path d="M94 266 Q22 294 16 400" stroke="url(#q5gold)" stroke-width="1.4" fill="none" opacity=".35"/>

  <!-- código -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="12" y="12" width="76" height="44" rx="11" fill="url(#q5gold)"/>
    <text x="50" y="40" font-size="24" font-weight="800" fill="#13100C">P5</text>
    <text x="50" y="51" font-size="8" font-weight="700" fill="#3A2C0A" letter-spacing=".6">ÉLITE</text>
  </g>
</svg>
