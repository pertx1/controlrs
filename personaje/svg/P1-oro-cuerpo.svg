    <path d="M90 112 Q88 132 90 150 M110 112 Q112 132 110 150" stroke="#E8DCC4" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="88.4" y="149" width="3.2" height="6" rx="1.4" fill="url(#pcgold)"/>
    <rect x="108.4" y="149" width="3.2" height="6" rx="1.4" fill="url(#pcgold)"/>

