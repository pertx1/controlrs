    <path d="M58 120 Q46 30 100 6 Q154 30 142 120 Q128 104 100 104 Q72 104 58 120 Z" fill="url(#pchood)"/>
    <path d="M67 108 Q62 46 100 24 Q138 46 133 108 Q120 98 100 98 Q80 98 67 108 Z" fill="#060607"/>
    <!-- cabeza con pasamontañas -->
    <path d="M74 68 Q73 32 100 30 Q127 32 126 68 Q126 96 112 104 Q100 110 88 104 Q74 96 74 68 Z" fill="url(#pcmask)"/>
    <path d="M74 68 Q73 32 100 30 Q127 32 126 68 Q126 96 112 104 Q100 110 88 104 Q74 96 74 68 Z" fill="url(#pcknit)"/>
    <path d="M100 31 L100 57 M100 74 L100 108" stroke="#000" stroke-width="1" opacity=".5"/>
    <rect x="78" y="57" width="44" height="16" rx="8" fill="url(#pcskin)"/>
    <rect x="78" y="57" width="44" height="6" rx="3" fill="#2A1C14" opacity=".55"/>
    <ellipse cx="89" cy="65.5" rx="4.8" ry="3.1" fill="#E4DCD2"/>
    <ellipse cx="111" cy="65.5" rx="4.8" ry="3.1" fill="#E4DCD2"/>
    <circle cx="89.6" cy="65.6" r="2.3" fill="#2E2219"/>
    <circle cx="111.6" cy="65.6" r="2.3" fill="#2E2219"/>
    <circle cx="90.4" cy="66.5" r=".8" fill="#F5DE9A"/>
    <circle cx="112.4" cy="66.5" r=".8" fill="#F5DE9A"/>
    <path d="M78 65 Q78 57 86 57 L114 57 Q122 57 122 65" stroke="#0A0A0B" stroke-width="2" fill="none"/>


    <!-- brazo derecho relajado, sin nada en la mano -->
    <path d="M144 120 Q166 132 166 182 L160 212 L144 210 L150 178 Z" fill="url(#pcbody)"/>
    <path d="M144 206 Q152 214 160 208" stroke="#0B0B0C" stroke-width="3" fill="none"/>
    <ellipse cx="152" cy="218" rx="7.5" ry="8.5" fill="#B98A66"/>
    <path d="M147 222 Q152 226 157 222" stroke="#8A6248" stroke-width="1.2" fill="none"/>

    <!-- luz dorada de borde -->
    <path d="M142 120 Q154 30 100 6" stroke="url(#pcgold)" stroke-width="1.8" fill="none" opacity=".6" filter="url(#pcb1)"/>
    <path d="M144 118 L152 234" stroke="url(#pcgold)" stroke-width="1.4" opacity=".35" filter="url(#pcb1)"/>
    <path d="M134 236 Q137 300 132 352" stroke="url(#pcgold)" stroke-width="1.2" fill="none" opacity=".3"/>
    <path d="M78 72 Q100 80 122 72" stroke="#F5DE9A" stroke-width="1.2" fill="none" opacity=".35" filter="url(#pcb1)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="12" y="12" width="86" height="44" rx="11" fill="#D4AF37"/>
    <text x="55" y="40" font-size="24" font-weight="800" fill="#13100C">P1</text>
    <text x="55" y="51" font-size="8" font-weight="700" fill="#3A2C0A" letter-spacing=".6">SOMBRA ORO</text>
  </g>
</svg>
