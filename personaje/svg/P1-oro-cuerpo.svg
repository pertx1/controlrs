<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- Pertx · cuerpo completo · P1 Sombra con colores de P5 · objeto: ninguno -->
  <defs>
    <radialGradient id="pcglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F5DE9A" stop-opacity=".75"/><stop offset=".45" stop-color="#D4AF37" stop-opacity=".35"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></radialGradient>
    <linearGradient id="pchood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E0E10"/><stop offset=".55" stop-color="#1F1E22"/><stop offset="1" stop-color="#2E2A24"/></linearGradient>
    <linearGradient id="pcbody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E0E10"/><stop offset=".5" stop-color="#1F1E22"/><stop offset="1" stop-color="#2A2620"/></linearGradient>
    <linearGradient id="pclegs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B0B0C"/><stop offset=".5" stop-color="#18171A"/><stop offset="1" stop-color="#232019"/></linearGradient>
    <radialGradient id="pcmask" cx="42%" cy="35%" r="70%"><stop offset="0" stop-color="#2C2C2E"/><stop offset="1" stop-color="#0B0B0C"/></radialGradient>
    <linearGradient id="pcskin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A3C2A"/><stop offset=".45" stop-color="#C08E6A"/><stop offset="1" stop-color="#E2BE7A"/></linearGradient>
    <linearGradient id="pcgold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5DE9A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#8E6E1E"/></linearGradient>
    <pattern id="pcknit" width="4" height="3.2" patternUnits="userSpaceOnUse"><path d="M0 1.6 Q1 0 2 1.6 T4 1.6" stroke="#000" stroke-opacity=".5" fill="none" stroke-width=".7"/></pattern>
    <filter id="pcb1"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="pcb6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="pcbg" cx="50%" cy="32%" r="80%"><stop offset="0" stop-color="#2A2219"/><stop offset=".55" stop-color="#13100C"/><stop offset="1" stop-color="#080706"/></radialGradient>
  </defs>
  <rect width="300" height="400" fill="url(#pcbg)"/>
  <path d="M0 378 H300" stroke="url(#pcgold)" stroke-width=".8" opacity=".35"/>
  <g transform="translate(50 12)">
    <ellipse cx="100" cy="380" rx="62" ry="7" fill="#000" opacity=".55"/>
    <!-- piernas: jogger negro -->
    <path d="M66 234 Q63 300 68 352 L97 352 L100 246 Z" fill="url(#pclegs)"/>
    <path d="M134 234 Q137 300 132 352 L103 352 L100 246 Z" fill="url(#pclegs)"/>
    <path d="M78 292 Q84 300 92 296 M122 292 Q116 300 108 296" stroke="#000" stroke-width="1.5" fill="none" opacity=".7"/>
    <rect x="67" y="342" width="31" height="11" rx="4" fill="#0B0B0C"/>
    <rect x="102" y="342" width="31" height="11" rx="4" fill="#0B0B0C"/>
    <!-- zapatillas negras con detalle dorado -->
