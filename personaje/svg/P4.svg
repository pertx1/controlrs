<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- P4 · Flat minimal · Pertx -->
  <rect width="300" height="400" fill="#EEF1FF"/>
  <circle cx="232" cy="96" r="44" fill="#DDE3FF"/>
  <ellipse cx="150" cy="378" rx="58" ry="7" fill="#C9D0EE"/>

  <!-- piernas -->
  <rect x="124" y="262" width="22" height="104" rx="4" fill="#E1E4EC"/>
  <rect x="154" y="262" width="22" height="104" rx="4" fill="#D3D7E2"/>
  <!-- zapatillas -->
  <path d="M116 366 h32 v12 h-38 a6 6 0 0 1 6 -12 z" fill="#FF6B6B"/>
  <path d="M184 366 h-32 v12 h38 a6 6 0 0 0 -6 -12 z" fill="#FF6B6B"/>
  <rect x="110" y="376" width="38" height="4" fill="#FFFFFF"/>
  <rect x="152" y="376" width="38" height="4" fill="#FFFFFF"/>

  <!-- brazo saludando -->
  <rect x="91" y="114" width="18" height="80" rx="9" fill="#2B59FF" transform="rotate(-18 100 190)"/>
  <circle cx="76" cy="112" r="11" fill="#F1C6A0"/>
  <!-- sudadera -->
  <path d="M106 172 h88 a10 10 0 0 1 10 10 v86 h-108 v-86 a10 10 0 0 1 10 -10 z" fill="#2B59FF"/>
  <rect x="96" y="256" width="108" height="12" fill="#1F45D6"/>
