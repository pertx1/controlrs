<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- P4 · ICONO · flat monocromo + verde ácido · Pertx -->
  <rect width="300" height="400" fill="#121212"/>
  <g stroke="#1E1E1E" stroke-width="1">
    <path d="M0 80 H300 M0 160 H300 M0 240 H300 M0 320 H300 M75 0 V400 M150 0 V400 M225 0 V400"/>
  </g>
  <rect x="0" y="352" width="300" height="48" fill="#C6FF00"/>

  <!-- cuerpo -->
  <path d="M40 352 L40 300 Q40 252 92 248 L208 248 Q260 252 260 300 L260 352 Z" fill="#000000"/>
  <path d="M40 352 L40 300 Q40 252 92 248 L208 248 Q260 252 260 300 L260 352 Z" fill="none" stroke="#2A2A2A" stroke-width="2"/>
  <rect x="190" y="276" width="30" height="16" rx="3" fill="#C6FF00"/>
  <text x="205" y="288.5" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#000" text-anchor="middle">PX</text>
  <!-- cuello -->
  <rect x="122" y="226" width="56" height="30" rx="8" fill="#0A0A0A"/>

  <!-- cabeza: pasamontañas de una abertura -->
  <rect x="88" y="78" width="124" height="160" rx="60" fill="#000000"/>
  <rect x="88" y="78" width="124" height="160" rx="60" fill="none" stroke="#2A2A2A" stroke-width="2"/>
  <!-- abertura de ojos -->
  <rect x="104" y="138" width="92" height="34" rx="17" fill="#D9A27E"/>
  <circle cx="130" cy="155" r="7" fill="#FFFFFF"/>
  <circle cx="170" cy="155" r="7" fill="#FFFFFF"/>
  <circle cx="131" cy="156" r="4" fill="#000000"/>
  <circle cx="171" cy="156" r="4" fill="#000000"/>
  <rect x="104" y="138" width="92" height="8" rx="4" fill="#000" opacity=".25"/>
  <!-- detalle de tejido -->
  <path d="M112 196 H188 M116 208 H184 M122 220 H178" stroke="#1C1C1C" stroke-width="3" stroke-linecap="round"/>

  <!-- código -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="12" y="12" width="76" height="44" rx="11" fill="#C6FF00"/>
    <text x="50" y="40" font-size="24" font-weight="800" fill="#000">P4</text>
    <text x="50" y="51" font-size="8" font-weight="700" fill="#2A2A2A" letter-spacing=".6">ICONO</text>
  </g>
</svg>
