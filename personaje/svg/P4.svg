  <path d="M136 178 v26 M164 178 v26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- brazo con portátil -->
  <rect x="200" y="178" width="18" height="70" rx="9" fill="#1F45D6"/>
  <rect x="210" y="198" width="50" height="38" rx="4" fill="#CDD2DD"/>
  <circle cx="235" cy="217" r="4" fill="#FFFFFF"/>
  <rect x="204" y="236" width="62" height="6" rx="3" fill="#B9BFCC"/>
  <circle cx="209" cy="244" r="10" fill="#F1C6A0"/>

  <!-- cuello y cabeza -->
  <rect x="142" y="156" width="16" height="20" fill="#E4B48C"/>
  <circle cx="150" cy="120" r="44" fill="#F1C6A0"/>
  <!-- pelo geométrico -->
  <path d="M106 118 a44 44 0 0 1 88 0 h-14 l-6 -14 l-10 14 h-58 z" fill="#1B1B1B"/>
  <rect x="104" y="104" width="10" height="34" rx="5" fill="#1B1B1B"/>
  <!-- cara mínima -->
  <circle cx="134" cy="130" r="4.5" fill="#1B1B1B"/>
  <circle cx="166" cy="130" r="4.5" fill="#1B1B1B"/>
  <path d="M138 146 q12 10 24 0" stroke="#1B1B1B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <circle cx="124" cy="142" r="6" fill="#FF6B6B" opacity=".35"/>
  <circle cx="176" cy="142" r="6" fill="#FF6B6B" opacity=".35"/>

  <!-- código -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="12" y="12" width="76" height="44" rx="11" fill="#1B1B1B"/>
    <text x="50" y="40" font-size="24" font-weight="800" fill="#FFFFFF">P4</text>
    <text x="50" y="51" font-size="8" font-weight="700" fill="#8FA8FF" letter-spacing=".5">FLAT MINIMAL</text>
  </g>
</svg>
